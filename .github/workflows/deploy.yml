# Deploys the schedule to Firebase on every push to main (and on demand from the Actions tab).
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   Variable  FIREBASE_PROJECT_ID   e.g. gingersues-schedule
#   Variable  WIF_PROVIDER          printed by tools/setup-github-deploy.sh (keyless sign-in to Google)
#   Secret    OWNER_PHONES          owner cell number(s), comma separated
#   Secrets   TWILIO_SID, TWILIO_TOKEN, TWILIO_FROM   (leave out until Twilio is approved)
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: github-deploy@${{ vars.FIREBASE_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Sync secrets
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          OWNER_PHONES: ${{ secrets.OWNER_PHONES }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: |
          for name in OWNER_PHONES TWILIO_SID TWILIO_TOKEN TWILIO_FROM; do
            val="${!name}"; [ -z "$val" ] && val="unset"
            printf '%s' "$val" > "$RUNNER_TEMP/secret.txt"
            npx firebase-tools functions:secrets:set "$name" --project "$PROJECT" --data-file "$RUNNER_TEMP/secret.txt" --non-interactive
          done
          rm -f "$RUNNER_TEMP/secret.txt"
      # A failed first deploy can leave trigger functions half-made (as plain web functions).
      # A push whose message contains [reset-triggers] deletes them first so they are made fresh.
      - name: Reset trigger functions
        if: contains(github.event.head_commit.message, '[reset-triggers]')
        run: |
          for f in syncRole phoneChanged onPublish onShiftUpdate onShiftDelete onTimeoffUpdate onRequestCreate onRequestUpdate; do
            npx firebase-tools functions:delete "$f" --region us-central1 --project "${{ vars.FIREBASE_PROJECT_ID }}" --force --non-interactive || echo "($f was not there)"
          done
      - name: Deploy
        run: npx firebase-tools deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
      # The Workspace org blocks "allUsers" on Cloud Run, so the two functions the sign-in page calls
      # are opened by turning off Cloud Run's invoker check instead. They verify the signed-in user themselves.
      - uses: google-github-actions/setup-gcloud@v2
      - name: Keep sign-in functions reachable
        run: |
          for s in linkaccount testtext; do
            gcloud run services update "$s" --region us-central1 --project "${{ vars.FIREBASE_PROJECT_ID }}" --no-invoker-iam-check -q
          done

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner tools · Ginger Sue's Schedule</title><meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>body{margin:0}[hidden]{display:none!important}
/* Layout: sticky header with tabs; week grid is a horizontally scrollable roster table (staff rows x day columns), summary strip above it. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface2:#eceee9; --ink:#17202b; --muted:#5b6672; --line:#dcdfd8;
  --accent:#0d6a61; --accent-ink:#ffffff; --ginger:#b86b00;
  --warn:#9a4a05; --warn-bg:#fcefd9; --bad:#b42318; --bad-bg:#fde7e4; --good:#16703d; --good-bg:#e1f2e7; --focus:#2457d6;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#18202a; --surface2:#202a35; --ink:#e7ecf1; --muted:#9ba7b3; --line:#2b3641;
  --accent:#41b6a8; --accent-ink:#06201c; --ginger:#f1a640;
  --warn:#f2b45c; --warn-bg:#3a2a12; --bad:#ff8b7c; --bad-bg:#3e1d1a; --good:#62d394; --good-bg:#16321f; --focus:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#18202a; --surface2:#202a35; --ink:#e7ecf1; --muted:#9ba7b3; --line:#2b3641;
  --accent:#41b6a8; --accent-ink:#06201c; --ginger:#f1a640;
  --warn:#f2b45c; --warn-bg:#3a2a12; --bad:#ff8b7c; --bad-bg:#3e1d1a; --good:#62d394; --good-bg:#16321f; --focus:#7aa2ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:22px} h3{font-size:16px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:12px 4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:700 21px/1.1 var(--f-display);letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--ginger)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:600;white-space:nowrap}
.pill.mgr{background:var(--accent);color:var(--accent-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.good{background:var(--good-bg);color:var(--good)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--ginger);color:var(--bg);font:600 11px/19px var(--f-mono);text-align:center}

.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;margin-top:14px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--surface2);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:16px 12px}
.toolbar .spacer{flex:1}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav strong{font:700 17px var(--f-display);min-width:150px;text-align:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.stat{background:var(--surface);padding:9px 14px;min-width:0}
.stat small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat b{font:600 19px var(--f-mono);font-variant-numeric:tabular-nums}
.stat b.warn{color:var(--warn)} .stat b.bad{color:var(--bad)}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.sched{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px}
.sched th,.sched td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:6px;text-align:left}
.sched tr>*:last-child{border-right:0}
.sched thead th{background:var(--surface2);font-size:12px;font-weight:600;padding:8px}
.sched thead th.today{color:var(--accent)}
.sched thead th .d{display:block;font:600 15px var(--f-display);color:var(--ink)}
.sched thead th.today .d{color:var(--accent)}
.sched .nm{position:sticky;left:0;z-index:2;background:var(--surface);width:190px;min-width:170px}
.sched thead .nm{background:var(--surface2);z-index:3}
.nm .n{font-weight:600;display:block;line-height:1.2}
.nm .s{font-size:12px;color:var(--muted)}
.nm .s.over{color:var(--bad);font-weight:600}
.sched tr.open td{background:color-mix(in srgb,var(--ginger) 7%,var(--surface))}
.sched tr.open .nm{background:color-mix(in srgb,var(--ginger) 7%,var(--surface))}
.sched tfoot td{background:var(--surface2);font-size:12px;border-bottom:0}
.sched tfoot .nm{background:var(--surface2)}
.sched tfoot .v{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.sched .tot{width:96px;min-width:90px;font-size:12px}
.sched .tot b{font:600 13px var(--f-mono);display:block}
.sched tr.grp td,.team tr.grp td{background:var(--surface2);padding-block:7px;border-bottom:1px solid var(--line)}
.sched tr.grp .nm{background:var(--surface2)}
.gname{font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.08em;margin-right:8px}
.sched tr.grp .gname{display:block}
td.cell{min-width:122px;height:58px;position:relative}
td.cell.unavail{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface2) 6px 12px)}
td.cell.over{outline:2px dashed var(--accent);outline-offset:-3px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-bottom:4px}
.tag.off{background:var(--bad-bg);color:var(--bad)} .tag.offq{background:var(--warn-bg);color:var(--warn)} .tag.ua{background:var(--surface2);color:var(--muted)}
.chip{--pc:#64748b;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;padding:4px 7px;border-radius:6px;background:color-mix(in srgb,var(--pc) 15%,var(--surface));border:1px solid transparent;border-left:3px solid var(--pc);font-size:12px;margin-bottom:4px;cursor:pointer;text-align:left;width:100%}
.chip .t{font:600 12px var(--f-mono);font-variant-numeric:tabular-nums}
.chip .p{color:var(--muted)}
.chip .lc{font:600 10px var(--f-mono);color:var(--muted)}
.chip.draft{background:var(--surface);border:1px dashed var(--pc);border-left:3px solid var(--pc)}
.chip.mine{box-shadow:inset 0 0 0 1px var(--pc)}
.chip .w{margin-left:auto;color:var(--warn);font-weight:700}
.chip.static{cursor:default}
.chip[draggable="true"]{cursor:grab}
.addc{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:6px;border:1px dashed var(--line);background:var(--surface);color:var(--muted);cursor:pointer;opacity:0;font-weight:700;line-height:1}
td.cell:hover .addc,.addc:focus-visible{opacity:1}
@media (hover:none){.addc{opacity:.7}}
.fc{width:84px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:500 12px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--pc)}

.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel + .panel{margin-top:0}
.stack{display:flex;flex-direction:column;gap:20px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .spacer{flex:1}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:180px}
.row .main b{display:block}
.date{width:52px;text-align:center;flex:none}
.date small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.date b{font:700 22px/1 var(--f-display)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;font-size:14px}
.rcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface)}
.rcard .main{flex:1;min-width:220px}
.rcard .kind{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.rcard .meta{font-size:13px;color:var(--muted)}
.rgrid{display:flex;flex-direction:column;gap:10px}

table.team{width:100%;border-collapse:collapse;min-width:820px}
.team th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.team td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.team tr:last-child td{border-bottom:0}
.dots{display:inline-flex;gap:3px}
.dots i{width:16px;height:16px;border-radius:4px;font:600 9px/16px var(--f-mono);text-align:center;font-style:normal;background:var(--good-bg);color:var(--good)}
.dots i.no{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.dots i.part{background:var(--warn-bg);color:var(--warn)}
.ptag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;margin:1px 2px 1px 0;background:color-mix(in srgb,var(--pc) 16%,var(--surface));border-left:2px solid var(--pc)}

.msgs{display:flex;flex-direction:column;gap:2px}
.msg{padding:10px 0;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.msg .h b{font-size:14px}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.checks input{accent-color:var(--accent)}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.warnbox{border-radius:8px;padding:8px 12px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.warnbox:empty{display:none}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.avail{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;font-size:13px}
.avail b{font-size:13px}

#modal{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px 16px;overflow-y:auto}
.dlg{background:var(--surface);border-radius:14px;width:100%;max-width:580px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.wide{max-width:720px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg .acts .spacer{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.hero-empty{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px;max-width:720px}
.hero-empty h2{font-size:26px}
.hero-empty .acts{display:flex;gap:10px;flex-wrap:wrap}
.settings-list{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 40px;gap:8px;align-items:center}
.srow.pos{grid-template-columns:minmax(0,1fr) 60px 40px}
.srow.loc{grid-template-columns:minmax(0,1fr) 90px 40px}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.addc{transition:opacity .15s,border-color .15s,background .15s}}
</style></head>
<body><header class="top"><div class="wrap"><div class="bar"><div class="brand"><b>Ginger Sue's <i>Owner tools</i></b></div></div></div></header>
<main class="wrap" id="app" style="padding-top:16px"></main>
<script type="module" src="/admin.js"></script>
</body></html>

    const c = cfg(); const lines = $("#bulkText").value.split("\n").map(l=>l.trim()).filter(Boolean);
    const matchLoc = t => { t = t.trim().toLowerCase(); const l = c.locations.find(l => l.code.toLowerCase()===t || l.name.toLowerCase()===t || l.name.toLowerCase().startsWith(t) || l.id===t); return l && l.id; };
    const matchPos = t => { t = t.trim().toLowerCase(); const p = c.positions.find(p => p.name.toLowerCase()===t || p.name.toLowerCase().startsWith(t)); return p && p.name; };
    const people = lines.map(l => { const [name, pos="", loc="", wage=""] = l.split(",").map(x=>x.trim()); return name ? {name, positions: pos.split("/").map(matchPos).filter(Boolean), locations: loc.split("/").map(matchLoc).filter(Boolean), wage: wage? +wage.replace(/[^0-9.]/g,"") : null, maxHours:null, active:true, avail:[]} : null; }).filter(Boolean);
    if (!people.length) return toast("Paste at least one line with a name.");
    closeModal(); const n = await many(people.map(p => () => put("staff", gid(), p)));
    const missing = people.filter(p => !p.positions.length || !p.locations.length).length;
    toast(`Added ${n} people${missing?`. ${missing} need positions or locations; edit them on Team.`:""}`);
  },
  newOff(el){ offModal(el.dataset.staff || null); },
  async saveOff(){
    const d = new FormData($("#offForm")); const from = d.get("from"), to = d.get("to");
    if (!from || !to) return toast("Pick the first and last day.");
    if (to < from) return toast("The last day is before the first day.");
    const approve = isMgr() && d.get("approve")==="on";
    closeModal(); await put("timeoff", gid(), {staffId:d.get("staffId"), from, to, note:(d.get("note")||"").trim(), status: approve?"approved":"pending", ts:Date.now()});
    toast(approve ? "Time off added" : "Time-off request sent to managers");
  },
  async cancelOff(el){ await patch("timeoff", el.dataset.id, {status:"cancelled"}); toast("Request cancelled"); },
  async approveOff(el){ const it = X().timeoff[el.dataset.id] || {}; const upd = {status:"approved", decidedTs:Date.now()};
    if (!it.staffId){ const sel = document.getElementById("who-"+el.dataset.id); if (!sel || !sel.value) return toast("Choose who this request is for first."); upd.staffId = sel.value; }
    await patch("timeoff", el.dataset.id, upd); toast("Time off approved"); },
  async checkEmail(){ await checkEmail(false); },
  emStoreOk(){ const v = $("#em-store").value; const f = emStoreRes; emStoreRes = null; f && f(v); },
  async denyOff(el){ await patch("timeoff", el.dataset.id, {status:"denied", decidedTs:Date.now()}); toast("Time off denied"); },
  async pickup(el){ const s = X().shifts[el.dataset.id]; const a = actor(); if (!s||!a) return;
    await put("requests", gid(), {type:"pickup", shiftId:el.dataset.id, staffId:a.id, status:"pending", date:s.date, start:s.start, end:s.end, loc:s.loc, pos:s.pos, ts:Date.now()}); toast("Pickup request sent to managers"); },
  async dropShift(el){ const s = X().shifts[el.dataset.id]; const a = actor(); if (!s||!a) return;
    if (!(await confirmBox("Ask to drop this shift?", `${fmtDate(s.date)} ${fmtRange(s)}. You're still on it until a manager approves.`, "Send request"))) return;
    await put("requests", gid(), {type:"drop", shiftId:el.dataset.id, staffId:a.id, status:"pending", date:s.date, start:s.start, end:s.end, loc:s.loc, pos:s.pos, ts:Date.now()}); toast("Drop request sent"); },
  askCover(el){ coverModal(el.dataset.id); },
  async sendCover(){
    const f = $("#coverForm"); const d = new FormData(f); const s = X().shifts[f.dataset.id]; const a = actor();
    closeModal(); await put("requests", gid(), {type:"cover", shiftId:f.dataset.id, staffId:a.id, targetId:d.get("targetId"), note:(d.get("note")||"").trim(), status:"coworker", date:s.date, start:s.start, end:s.end, loc:s.loc, pos:s.pos, ts:Date.now()});
    toast(`Asked ${staffName(d.get("targetId")).split(" ")[0]} to cover`);
  },
  async coverYes(el){ await patch("requests", el.dataset.id, {status:"pending", acceptedTs:Date.now()}); toast("Accepted. A manager will approve it."); },
  async coverNo(el){ await patch("requests", el.dataset.id, {status:"declined"}); toast("Declined"); },
  async cancelReq(el){ await patch("requests", el.dataset.id, {status:"cancelled"}); toast("Request cancelled"); },
  async approveReq(el){
    const r = {id:el.dataset.id, ...X().requests[el.dataset.id]}; const s = X().shifts[r.shiftId];
    if (!s) return toast("That shift no longer exists.");
    if (r.type==="pickup"){
      if (s.staffId) return toast("Someone already has this shift.");
      await patch("shifts", r.shiftId, {staffId:r.staffId});
      for (const o of list("requests")) if (o.id!==r.id && o.shiftId===r.shiftId && o.type==="pickup" && o.status==="pending") await patch("requests", o.id, {status:"denied", decidedTs:Date.now()});
    } else if (r.type==="drop"){ await patch("shifts", r.shiftId, {staffId:null}); }
    else if (r.type==="cover"){ await patch("shifts", r.shiftId, {staffId:r.targetId}); }
    await patch("requests", r.id, {status:"approved", decidedTs:Date.now()});
    toast(r.type==="drop" ? "Approved. The shift is now open." : "Approved and updated on the schedule");
  },
  async denyReq(el){ await patch("requests", el.dataset.id, {status:"denied", decidedTs:Date.now()}); toast("Request denied"); },
  linkMe(){ linkModal(); },
  async claim(el){ closeModal(); if (!S.uid) return toast("Sign in to link your name."); await patch("staff", el.dataset.id, {uid:S.uid}); S.tab = "mine"; store.set("tab","mine"); toast("You're linked. Here are your shifts."); },
  async postMsg(){
    const t = $("#msgText"); const text = t.value.trim(); if (!text) return toast("Write a message first.");
    const a = actor() || me();
    const ok = await put("messages", gid(), {text, loc:$("#msgTo").value, staffId: a?a.id:null, role: S.owner?"owner":"manager", ts:Date.now()});
    if (ok){ t.value = ""; toast("Posted"); render(); }
  },
  async delMsg(el){ if (!(await confirmBox("Delete this message?", "It's removed for everyone.", "Delete", true))) return; await del("messages", el.dataset.id); },
  addRow(el){ const c = structuredClone(cfg()); const k = el.dataset.k; collectSettings(c);
    if (k==="positions") c.positions.push({name:"New position", color:"#64748b"});
    if (k==="templates") c.templates.push({name:"New", start:"07:00", end:"14:00"});
    if (k==="locations") c.locations.push({id:"loc-"+gid().slice(-5), name:"New location", code:"NEW"});
    pendingCfg = c; renderSettingsDraft(); },
  rmRow(el){ const c = structuredClone(cfg()); collectSettings(c); c[el.dataset.k].splice(+el.dataset.i,1); pendingCfg = c; renderSettingsDraft(); },
  async saveSettings(){ const c = structuredClone(cfg()); collectSettings(c);
    if (!c.locations.length || !c.positions.length) return toast("Keep at least one location and one position.");
    pendingCfg = null; await put("config","main", c); toast("Settings saved"); render(); }
};
function collectSettings(c){
  document.querySelectorAll("#app [data-k][data-i][data-f]").forEach(el => { const arr = c[el.dataset.k]; const i = +el.dataset.i; if (arr && arr[i]) arr[i][el.dataset.f] = el.value.trim(); });
  const dm = document.querySelector('#app [data-k="defaultMax"]'); if (dm) c.defaultMax = Math.max(1, +dm.value || 40);
}
function renderSettingsDraft(){ document.querySelectorAll("#app [data-k][data-keep]").forEach(el => el.removeAttribute("data-keep")); render(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const m = $("#modal"); if (e.target === m) { closeModal(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); if ((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches('div[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.chg === "shiftForm") updateShiftWarn();
  if (el.dataset.chg === "driveAuto"){ try { localStorage.setItem("gss-driveAuto", el.checked ? "1" : "0"); } catch {} }
  if (el.dataset.chg === "posToggle"){ const row = document.querySelector(`.rate-row[data-pos="${CSS.escape(el.value)}"]`); if (row) row.hidden = !el.checked; }
  if (el.dataset.chg === "viewAs"){ S.viewAs = el.value || null; render(); }
  if (el.dataset.chg === "forecast"){ const v = +el.value || 0; const id = S.loc + "_" + el.dataset.date; put("forecast", id, {loc:S.loc, date:el.dataset.date, sales:v}); }
});
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.chg === "shiftForm") updateShiftWarn(); });
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest(".chip[data-id]"); if (!c || !isMgr()) return; dragId = c.dataset.id; e.dataTransfer.effectAllowed = "copyMove"; try { e.dataTransfer.setData("text/plain", dragId); } catch {} });
document.addEventListener("dragover", e => { const td = e.target.closest && e.target.closest("td[data-drop]"); if (!td || !dragId) return; e.preventDefault(); document.querySelectorAll("td.over").forEach(x=>x!==td&&x.classList.remove("over")); td.classList.add("over"); });
document.addEventListener("dragleave", e => { const td = e.target.closest && e.target.closest("td[data-drop]"); if (td && !td.contains(e.relatedTarget)) td.classList.remove("over"); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll("td.over").forEach(x=>x.classList.remove("over")); });
document.addEventListener("drop", async e => {
  const td = e.target.closest && e.target.closest("td[data-drop]"); if (!td || !dragId) return; e.preventDefault();
  const id = dragId; dragId = null; td.classList.remove("over");
  const s = shiftById(id); if (!s) return;
  const staffId = td.dataset.staff || null, date = td.dataset.date; const copy = e.altKey || e.ctrlKey || e.metaKey;
  if (copy){ const {...rest} = s; await put(SC(), gid(), toDoc({...rest, staffId, date, published:false, ts:Date.now()})); toast(S.std ? "Copied" : "Copied as a draft"); }
  else { if (s.staffId === staffId && s.date === date) return; await patch(SC(), id, toDoc({staffId, date})); const w = warnings({...s, id, staffId, date}); toast(w.length ? "Moved. Heads up: " + w[0] : "Shift moved"); }
});

/* ---------- data subscriptions ---------- */
let winUnsubs = [];
function snapTo(col){ return snap => { const o = {}; snap.docs.forEach(d => { if (d.exists !== false) o[d.id] = d.data(); }); R[col] = o; S.loaded[col] = true; if (!S.demo) queue(); }; }
const onErr = col => e => { console.warn(col, e); if (e && (e.code==="revoked"||e.code==="not_granted")) { S.noDb = true; queue(); } };
function subWindow(){
  if (!S.db) return;
  const t = today(); const from = addD(S.ws < t ? S.ws : t, -7); const to = addD(S.ws > t ? S.ws : t, 34);
  winUnsubs.forEach(u => { try{u();}catch{} });
  winUnsubs = [
    S.db.collection("shifts").where("date", ">=", from).where("date", "<=", to).onSnapshot(snapTo("shifts"), onErr("shifts")),
    S.db.collection("forecast").where("date", ">=", from).where("date", "<=", to).onSnapshot(snapTo("forecast"), onErr("forecast"))
  ];
}
async function init(){
  render();
  const c = window.claude;
  let db = null, user = null;
  try { [db, user] = await Promise.all([c && c.use ? c.use("db") : null, c && c.use ? c.use("user") : null]); } catch {}
  S.db = db; S.user = user;
  if (user){
    try { S.owner = !!(await user.isOwner()); S.admin = !!(await user.canEdit()); S.uid = await user.id(); const w = await user.can("data.write"); S.canWrite = w !== false; } catch {}
  }
  if (!db){ S.noDb = true; render(); return; }
  if (store.get("tab", null) == null) S.tab = (S.owner || S.admin) ? "schedule" : "mine";
  db.doc("config/main").onSnapshot(s => { R.config = s.exists ? {...DEFAULT_CONFIG, ...s.data()} : null; if (!S.demo) queue(); }, onErr("config"));
  db.collection("staff").onSnapshot(snapTo("staff"), onErr("staff"));
  db.collection("standard").onSnapshot(snapTo("standard"), onErr("standard"));
  db.collection("timeoff").onSnapshot(snapTo("timeoff"), onErr("timeoff"));
  db.collection("emailImports").onSnapshot(snapTo("emailImports"), onErr("emailImports"));
  setTimeout(emailTick, 8000); setInterval(emailTick, 10*60*1000);
  db.collection("requests").onSnapshot(snapTo("requests"), onErr("requests"));
  db.collection("messages").orderBy("ts","desc").limit(150).onSnapshot(snapTo("messages"), onErr("messages"));
  subWindow();
}

  for (let d=0; d<7; d++){

    if (d!==4) add("d6",d,"06:00","14:00","Shift Lead","liberty");

    add("d9",d,"06:00","14:00","Line Cook","liberty");
    if (d!==5) add("d10",d,"06:00","14:00","Shift Lead","olathe");

  }
  add(null,3,"07:00","13:00","Busser","liberty"); add("d1",4,"07:00","14:00","Server","liberty",false); add("d4",0,"08:00","13:00","Host","lees-summit",false);

  for (const l in base) for (let d=0; d<7; d++) forecast[l+"_"+addD(ws,d)] = {loc:l, date:addD(ws,d), sales: Math.round(base[l]*(d>=5?1.7:d===4?1.15:1)/50)*50};
  const findShift = (sid,d) => Object.keys(shifts).find(id => shifts[id].staffId===sid && shifts[id].date===addD(ws,d));

    m2:{text:"New seasonal pancake starts Monday at all three stores. Tasting at pre-shift.", loc:"all", staffId:null, role:"owner", ts:Date.now()-86400e3}
  };
  return {config: structuredClone(DEFAULT_CONFIG), staff, shifts, standard:{}, emailImports:{}, timeoff, requests, messages, forecast};
}

window.__gssReady.then(init);
})();
